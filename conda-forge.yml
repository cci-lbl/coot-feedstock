azure:
  user_or_org: cctbx-release
  project_name: feedstock-builds
conda_build:
  pkg_format: '2'
  zstd_compression_level: 22
github:
  user_or_org: cci-lbl
  repo_name: coot-feedstock
  branch_name: main
  tooling_branch_name: main
provider:
  osx_arm64: github_actions
test: native
upload_on_branch: main
workflow_settings:
  store_build_artifacts:
  - platform:
    - linux_64
    - osx_64
    - osx_arm64
    - win_64
    value: true