{% set name = "coot" %}
{% set version = "1.3.4" %}
{% set extras_place = "https://www2.mrc-lmb.cam.ac.uk/personal/pemsley/coot/dependencies" %}
# rdkit release whose BoundsMatrixBuilderDetails.h is fetched below; keep
# in step with the librdkit-dev that resolves in the host environment.
{% set rdkit_release = "Release_2026_09_1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/pemsley/coot/archive/refs/tags/Release-{{ version }}.tar.gz
  # - git_url: https://github.com/pemsley/coot.git
  #   git_depth: 1
    folder: coot
  - url: {{ extras_place }}/clipper-2.1.20180802.tar.gz
    folder: clipper
  - url: https://github.com/schrodinger/coordgenlibs/archive/refs/tags/v3.0.2.tar.gz
    folder: coordgenlibs
  - url: {{ extras_place }}/fftw-2.1.5.tar.gz
    folder: fftw
  - url: {{ extras_place }}/libccp4-8.0.0.tar.gz
    folder: libccp4
  - url: https://github.com/schrodinger/maeparser/archive/refs/tags/v1.3.3.tar.gz
    folder: maeparser
  - url: {{ extras_place }}/mmdb2-2.0.22.tar.gz
    folder: mmdb2
  - url: {{ extras_place}}/ssm-1.4.tar.gz
    folder: ssm
  - url: {{ extras_place }}/reference-structures.tar.gz
    folder: reference-structures
  - url: {{ extras_place }}/refmac-monomer-library.tar.gz
    folder: monomers
  # VTE terminal widget (GTK4 flavor) for the Python console and AI button.
  # conda-forge's vte package is linux-64 only, so build it here.
  - url: https://download.gnome.org/sources/vte/0.84/vte-0.84.1.tar.xz  # [not win]
    sha256: aca1caa8478aebcdbb1d67897fb3511eb7601debae6810e16a15b6fa25f31ac8  # [not win]
    folder: vte  # [not win]
    patches:  # [not win]
      # On macOS the forked child sizes a stack buffer from RLIMIT_NOFILE
      # (8 MiB at the common 1048576 limit) and dies before exec.
      - patches/vte-fdwalk-bounded-buffer.patch  # [not win]
  # On Windows the C++ stack is built here with MinGW and vendored, because
  # conda-forge's boost, rdkit, and gemmi are MSVC builds that MinGW cannot
  # link. See docs/superpowers/specs/2026-10-26-windows-mingw-build-design.md.
  - url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2  # [win]
    sha256: 49551aff3b22cbc5c5a9ed3dbc92f0e23ea50a0f7325b0d198b705e8ee3fc305  # [win]
    folder: boost  # [win]
  - url: https://github.com/rdkit/rdkit/archive/refs/tags/Release_2026_09_1.tar.gz  # [win]
    sha256: 86711e340759a3a0678a2e62f54f26f7ff564c3a02de0460f60b1ce89ac1bfe9  # [win]
    folder: rdkit  # [win]
  - url: https://github.com/project-gemmi/gemmi/archive/refs/tags/v0.7.5.tar.gz  # [win]
    sha256: 9e2a8a51e62c69bf43f62aadf527ca4312860de8a36c12a8747d3e8ae556f0b3  # [win]
    folder: gemmi  # [win]
  # Coot's MinGW code path calls POSIX glob(), which mingw-w64 lacks.
  # WinCoot vendors GNU make's copy of the glibc glob (LGPL-2.0-or-later).
  - url: https://bernhardcl.github.io/coot/software/extras/glob-1.0.tar.bz2  # [win]
    sha256: 17666adcac4ad42522eacac42ce4f888cc1f6b082d237500b4934f564f7f97fe  # [win]
    folder: glob  # [win]
    patches:  # [win]
      - patches/glob-pattern-p-prototype.patch  # [win]
  # rdkit 2026.09.1 made the public BoundsMatrixBuilder.h include
  # BoundsMatrixBuilderDetails.h (rdkit PR #9434) but did not add the new
  # file to the CMake install list, so librdkit-dev lacks it. build.sh
  # drops this copy into the rdkit include tree when it is missing.
  - url: https://raw.githubusercontent.com/rdkit/rdkit/{{ rdkit_release }}/Code/GraphMol/DistGeomHelpers/BoundsMatrixBuilderDetails.h
    sha256: 1b1c0d298a69ef3c71a9fc43765cb51c057620bd4facbbab97489f5d9251890c
    folder: rdkit-headers
  - patches:
      # for libccp4 on Apple Silicon
      # - patches/libccp4.patch
      # for clang and C++11 "C++11 requires a space between literal and identifier"
      - patches/ssm_superpose.patch
      # find_library/find_path for the CCP4 stack so the CMake build
      # configures on every platform without per-platform -D flags.
      - patches/coot-cmake-portable-deps.patch
      # Install the MCP socket bridge + skills tree under share/coot/mcp/.
      - patches/coot-cmake-install-mcp.patch
      # Let the bridge import mcp 2.x (MCPServer) as well as 1.x (FastMCP).
      - patches/coot-mcp-bridge-mcp2.patch
      # MinGW port of the newer Coot code, taken from Bernhard Lohkamp's WinCoot
      # branch (bernhardcl/coot, gtk4): POSIX headers, winsock for the JSON-RPC
      # socket, std::filesystem::path to string conversions, LLP64 logging
      # overloads, link flags, layla globals, and Windows startup behavior.
      - patches/coot-mingw-posix-headers.patch  # [win]
      - patches/coot-mingw-stdout-member.patch  # [win]
      - patches/coot-mingw-path-to-string.patch  # [win]
      - patches/coot-mingw-logging-overloads.patch  # [win]
      - patches/coot-mingw-link-flags.patch  # [win]
      - patches/coot-mingw-layla-globals.patch  # [win]
      - patches/coot-mingw-coot-utils.patch  # [win]
      - patches/coot-mingw-startup.patch  # [win]
      - patches/coot-mingw-strict-ansi.patch  # [win]

build:
  number: 0
  skip: True  # [py<311]
  # win2 branch: iterate on one Python version; drop before merge.
  skip: True  # [win and py != 312]
  # ignore_run_exports:
  #   - expat
  #   - gemmi
  #   - guile  # [linux]
  #   - pygobject
  #   - glfw
  #   - libboost
  #   - libexpat
  #   - libgl  # [linux]

requirements:
  build:
    - python                                # [build_platform != target_platform]
    - cross-python_{{ target_platform }}    # [build_platform != target_platform]
    - gtk4  # [build_platform != target_platform]
    - cairo  # [build_platform != target_platform]
    - expat  # [build_platform != target_platform]
    - epoxy  # [build_platform != target_platform]
    - freetype  # [build_platform != target_platform]
    - gdk-pixbuf  # [build_platform != target_platform]
    - gettext  # [build_platform != target_platform]
    - glib  # [build_platform != target_platform]
    - harfbuzz  # [build_platform != target_platform]
    - libdrm  # [linux and (build_platform != target_platform)]
    - libtiff  # [build_platform != target_platform]
    - libpng  # [build_platform != target_platform]
    - libjpeg-turbo  # [build_platform != target_platform]
    - liblzma-devel  # [build_platform != target_platform]
    - zlib  # [build_platform != target_platform]
    - libgraphene  # [build_platform != target_platform]
    - pango  # [build_platform != target_platform]
    - {{ compiler('c') }}  # [not win]
    - {{ stdlib('c') }}  # [not win]
    - {{ compiler('cxx') }}  # [not win]
    - {{ compiler('fortran') }}  # [not win]
    # Windows: MinGW-w64 GCC and the MSYS2 autotools; see the design note.
    - {{ compiler('m2w64_c') }}  # [win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ stdlib('m2w64_c') }}  # [win]
    - m2-base  # [win]
    - m2-bash  # [win]
    - m2-make  # [win]
    - m2-autoconf  # [win]
    - m2-automake1.16  # [win]
    - m2-automake-wrapper  # [win]
    - m2-libtool  # [win]
    - m2-m4  # [win]
    - m2-patch  # [win]
    - m2-pkg-config  # [win]
    - autoconf  # [unix]
    - automake  # [unix]
    - cmake
    - libtool  # [unix]
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - m4  # [unix]
    - make  # [unix]
    - meson  # [not win]
    - ninja  # [not win]
    - pkg-config  # [unix]
    - swig
  host:
    - cairo
    - doxygen
    - eigen  # [win]
    - epoxy
    - expat
    - fast_float  # [not win]
    - fmt  # [not win]
    - freetype
    - gdk-pixbuf
    - gemmi  # [not win]
    - glfw
    - glib
    - glm
    - gnutls  # [not win]
    - gsl
    - guile  # [linux]
    - libboost-python-devel  # [not win]
    - libboost-devel  # [not win]
    - libcurl
    - libgl-devel  # [linux]
    # The MinGW runtime must sit in the host env's Library/bin: the CMake
    # build imports the nanobind module with conda's python to write the
    # stub, and that python resolves DLLs only under its own prefix.
    - libgcc  # [win]
    - libgomp  # [win]
    - libstdcxx  # [win]
    - libwinpthread  # [win]
    - libgraphene
    - libopenblas
    - libpng
    - libsqlite
    - lz4-c  # [not win]
    - nanobind
    - pango
    - pcre2  # [not win]
    - pygobject
    - python
    - simdutf  # [not win]
    - gtk4
    - librdkit-dev  # [not win]
    - zlib
  run:
    - epoxy
    - expat
    - gemmi  # [not win]
    - glfw
    - gsl
    - guile  # [linux]
    - libcurl
    - libgraphene
    # share/coot/mcp/coot_mcp_socket_bridge.py (patched above for mcp 2.x)
    - mcp >=1.2
    - pygobject
    - python
    - gtk4
    - librdkit  # [not win]
    # MinGW runtime for the GCC-built Coot and its vendored C++ stack.
    - libgcc  # [win]
    - libgomp  # [win]
    - libstdcxx  # [win]
    - libwinpthread  # [win]
    # gtk4 on win-64 ships schema XML but no gschemas.compiled and no
    # post-link; post-link.bat compiles them with glib-compile-schemas.
    - glib-tools  # [win]

test:
  # Some packages might need a `test/commands` key to check CLI.
  # List all the packages/modules that `run_test.py` imports.
  # imports:
  #   - simplejson
  #   - simplejson.tests
  # For python packages, it is useful to run pip check. However, sometimes the
  # metadata used by pip is out of date. Thus this section is optional if it is
  # failing.
  # requires:
  #   - pip
  commands:
    - ls  # [unix]
    - dir  # [win]
    # Windows: the GUI build installs mini-rsr-bin.exe to Library/bin, and
    # the CMake build's nanobind module must import against conda's python.
    - mini-rsr-bin --help  # [win]
    - python -c "import coot_headless_api"  # [win]

about:
  home: https://www2.mrc-lmb.cam.ac.uk/personal/pemsley/coot/
  summary: 'Coot'
  description: |
    Coot is for macromolecular model building, model completion and validation, particularly suitable for protein modelling using X-ray data.
    Coot displays maps and models and allows model manipulations such as idealization, real space refinement, manual rotation/translation, rigid-body fitting, ligand search, solvation, mutations, rotamers, Ramachandran plots, skeletonization, non-crystallographic symmetry and more.
    These days it is useful for cryo-EM data and models, too.
  license: LGPL-3.0-only
  license_family: LGPL
  doc_url: https://www2.mrc-lmb.cam.ac.uk/personal/pemsley/coot/web/docs/
  dev_url: https://github.com/pemsley/coot

extra:
  recipe-maintainers:
    - pemsley
    - LucreziaCatapano
    - bkpoon
