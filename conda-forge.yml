azure:
  user_or_org: cctbx-release
  project_name: feedstock-builds
conda_build:
  pkg_format: '2'
  zstd_compression_level: 22
github:
  user_or_org: cci-lbl
  repo_name: coot-feedstock
  branch_name: main
  tooling_branch_name: main
provider:
  # win2 branch: only win_64 builds while the Windows port is iterated.
  # Restore linux_64 (default), linux_aarch64: native, osx_64 (default),
  # and osx_arm64: github_actions before merging.
  linux_64: None
  linux_aarch64: None
  osx_64: None
  osx_arm64: None
  win_64: github_actions
test: native
upload_on_branch: main
workflow_settings:
  store_build_artifacts:
  - platform:
    - linux_64
    - linux_aarch64
    - osx_64
    - osx_arm64
    - win_64
    value: true
